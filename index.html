<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg:#000; --accent:#ff204e; --text:#fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        .app { max-width: 420px; margin: auto; height: 100vh; position: relative; overflow: hidden; }
        .header { display: flex; justify-content: space-between; padding: 20px; z-index: 10; position: relative; }
        .main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
        #app-logo { height: 40px; }
        .station-logo { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .btn-play { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); border: none; color: white; margin-top: 20px; font-size: 24px; cursor: pointer; }
        .ad-space { position: absolute; bottom: 0; width: 100%; height: 90px; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <button onclick="loadLive()">°LIVE</button>
            <nav>
                <button onclick="loadPodcast()">PODCAST</button>
                <button onclick="loadReplay()">REPLAY</button>
            </nav>
        </header>
        
        <main class="main" id="main-content">
            <img id="app-logo" src="" alt="Logo">
            <img id="station-logo" class="station-logo" src="" alt="Station">
            <h2 id="station-name">Chargement...</h2>
            <button class="btn-play" onclick="togglePlay()">▶</button>
        </main>

        <div id="ad-space" class="ad-space"></div>
    </div>

    <script>
        async function initApp() {
            const resp = await fetch('data.json');
            const data = await resp.json();
            window.APP_DATA = data;
            
            // Mise en place du logo global
            document.getElementById('app-logo').src = data.global.logo_app;
            
            // Charger le Live par défaut
            loadLive();
        }

        function loadLive() {
            const live = APP_DATA.playlist.find(p => p.isLive);
            document.getElementById('station-name').textContent = live.emission;
            document.getElementById('station-logo').src = live.logo_centrale;
        }

        function togglePlay() { alert("Lecture lancée"); }

        initApp();
    </script>
</body>
</html>
