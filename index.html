<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player Pro</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .nav-btns { display: flex; gap: 10px; }
        .btn { cursor: pointer; padding: 5px 10px; background: #222; border: 1px solid #444; color: #fff; }
        #view-content { padding: 20px; }
        .ad-banner { position: fixed; bottom: 0; width: 100%; text-align: center; }
    </style>
</head>
<body>

<header class="header">
    <button onclick="loadSection('live')">°LIVE</button>
    <div class="nav-btns">
        <button onclick="loadSection('podcast')">PODCAST</button>
        <button onclick="loadSection('replay')">REPLAY</button>
        <button onclick="loadSection('contact')">CONTACT</button>
    </div>
</header>

<div id="view-content"></div>
<div id="ad-space" class="ad-banner"></div>

<script>
    let DATA = {};
    async function loadData() {
        const res = await fetch('data.json');
        DATA = await res.json();
        // Afficher la pub
        if(DATA.global.ads_enabled) {
            document.getElementById('ad-space').innerHTML = `<img src="${DATA.global.ads_url}">`;
        }
        loadSection('live');
    }

    function loadSection(type) {
        const container = document.getElementById('view-content');
        container.innerHTML = "";
        
        if(type === 'live') {
            const live = DATA.playlist.find(p => p.IsLive);
            container.innerHTML = `<h1>${live.Emission}</h1><p>${live.Crew}</p><button onclick="play('${live.Url}')">▶ Lancer</button>`;
        } 
        else if(type === 'replay') {
            container.innerHTML = `<h1>Replay</h1><input type="text" placeholder="Rechercher...">`;
            // Ici tu peux ajouter une boucle qui liste les items avec Stream-type === 'replay'
        }
        else if(type === 'contact') {
            container.innerHTML = `<h1>Contact</h1><p>${DATA.global.entreprise}</p><p>${DATA.global.email}</p>`;
        }
    }

    function play(url) { console.log("Lecture de :", url); }
    window.onload = loadData;
</script>
</body>
</html>
