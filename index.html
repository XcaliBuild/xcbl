<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Smart Hub OS</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --font: 'Google Sans', -apple-system, sans-serif;
        --bg-img: url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=2070');
        --card-bg: rgba(30, 30, 30, 0.6);
        --card-border: rgba(255, 255, 255, 0.1);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --icon-color: #ffffff;
        --blur: 25px;
        --accent: #a8c7fa;
        --idle-color: #ffffff;
    }

    body.light-glass {
        --card-bg: rgba(255, 255, 255, 0.7); --card-border: rgba(0, 0, 0, 0.1);
        --text-primary: #202124; --text-secondary: #5f6368;
        --icon-color: #202124; --accent: #0b57d0;
    }
    body.blue-glass { --card-bg: rgba(10, 40, 80, 0.6); --accent: #8ab4f8; }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font); color: var(--text-primary); overflow: hidden; background: #000; height: 100vh; width: 100vw; transition: color 0.5s; }

    /* Arrière-plan global */
    .background {
        position: absolute; inset: 0; z-index: -2;
        background-image: var(--bg-img);
        background-size: cover; background-position: center;
        transition: filter 0.8s ease, opacity 0.8s ease;
    }
    body.standby-mode .background { opacity: 0; /* Fond noir OLED */ }

    /* --- MODE VEILLE (IDLE) --- */
    #idle-screen {
        position: absolute; inset: 0; z-index: 30;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
        transition: opacity 0.5s; cursor: pointer;
    }
    body.standby-mode #idle-screen { background: #000000; } /* OLED Pur */
    #idle-screen.hidden { opacity: 0; pointer-events: none; }

    .idle-time { font-weight: 500; line-height: 1; color: var(--idle-color); transition: all 0.5s ease; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }
    /* Tailles de l'horloge en veille */
    .idle-time.size-small { font-size: 80px; }
    .idle-time.size-medium { font-size: 140px; }
    .idle-time.size-large { font-size: 220px; font-weight: 700; letter-spacing: -5px; }
    /* Mode iPhone Standby (Rouge) */
    body.standby-mode .idle-time { color: #ff3b30; text-shadow: none; }

    .idle-weather { font-size: 32px; font-weight: 500; color: var(--idle-color); display: flex; align-items: center; gap: 10px; margin-top: 20px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    body.standby-mode .idle-weather { color: #ff3b30; text-shadow: none; }

    /* --- TABLEAU DE BORD (ACTIF) --- */
    #dashboard {
        position: absolute; inset: 0; z-index: 20;
        padding: 30px 40px; display: grid;
        grid-template-columns: 1.2fr 1fr 1fr; grid-template-rows: auto 1fr;
        gap: 20px; opacity: 0; pointer-events: none;
        transition: opacity 0.5s, transform 0.5s; transform: scale(0.95);
    }
    #dashboard.active { opacity: 1; pointer-events: auto; transform: scale(1); }
    #dashboard.active ~ .background { filter: blur(25px) brightness(0.6); }

    header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; }
    .header-nav { display: flex; gap: 20px; font-size: 18px; font-weight: 500; color: var(--text-secondary); }
    .header-nav span.active { color: var(--text-primary); border-bottom: 3px solid var(--accent); padding-bottom: 5px; }

    /* Cartes */
    .card {
        background: var(--card-bg); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
        border: 1px solid var(--card-border); border-radius: 28px;
        padding: 24px; display: flex; flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: background 0.5s;
    }
    
    /* Media (Priorité Radio) */
    .media-card { grid-row: span 2; justify-content: space-between; background: linear-gradient(135deg, var(--card-bg), rgba(0,0,0,0.3)); }
    .media-art { width: 100%; height: 200px; border-radius: 16px; background: url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=600') center/cover; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .media-info h3 { font-size: 24px; margin-bottom: 5px; }
    .media-info p { color: var(--accent); font-weight: 500; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: auto; }
    
    .btn-icon { background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 15px; border-radius: 50%; transition: background 0.2s; z-index: 50; }
    .btn-icon:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }
    .btn-icon svg { width: 32px; height: 32px; fill: var(--icon-color); pointer-events: none; }
    .btn-play { background: var(--text-primary); width: 70px; height: 70px; }
    .btn-play svg { fill: var(--card-bg); width: 36px; height: 36px; }

    /* Liste Radios */
    .info-card h4 { font-size: 18px; color: var(--text-secondary); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .info-card h4 svg { width: 20px; height: 20px; fill: var(--text-secondary); pointer-events: none; }
    .radio-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }
    .radio-item { display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); cursor: pointer; transition: background 0.2s; }
    .radio-item:active { background: rgba(255,255,255,0.1); transform: scale(0.98); }
    .theme-light-glass .radio-item { background: rgba(255,255,255,0.4); }

    /* Météo (Clique pour Paramètres) */
    .weather-card { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .weather-card:active { transform: scale(0.98); }
    .w-temp { font-size: 64px; font-weight: 400; }
    .w-icon svg { width: 80px; height: 80px; fill: var(--icon-color); pointer-events: none; }

    /* --- PARAMETRES --- */
    #settings-panel { 
        position: absolute; bottom: 30px; right: 40px; display: none; 
        background: var(--card-bg); padding: 25px; border-radius: 20px; 
        backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        border: 1px solid var(--card-border); z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    #settings-panel.show { display: flex; flex-direction: column; gap: 12px; }
    .settings-group { display: flex; flex-direction: column; gap: 5px; }
    .settings-group label { font-size: 14px; color: var(--text-secondary); font-weight: bold; }
    select, input { padding: 10px; border-radius: 8px; border: none; background: rgba(255,255,255,0.15); color: var(--text-primary); outline: none; font-family: var(--font); font-size: 16px; cursor: pointer; }
    select option { background: #333; color: #fff; }

</style>
</head>
<body class="dark-glass" id="app-body">

    <!-- Fond d'écran dynamique -->
    <div class="background" id="bg-img"></div>

    <!-- ECRAN DE VEILLE (Clique pour réveiller) -->
    <div id="idle-screen" onclick="wakeUp()">
        <div class="idle-time size-medium" id="idle-clock">10:13</div>
        <div class="idle-weather">
            <svg style="width:40px;height:40px;fill:currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
            <span id="idle-temp">24°</span>
        </div>
    </div>

    <!-- TABLEAU DE BORD ACTIF (Clique pour maintenir éveillé) -->
    <div id="dashboard" onclick="keepAwake()">
        <header>
            <div class="header-nav">
                <span class="active">Radio & Médias</span>
                <span>Maison</span>
            </div>
            <div class="header-nav"><span id="dash-clock">10:13</span></div>
        </header>

        <!-- Lecteur Principal -->
        <div class="card media-card">
            <div class="media-art" id="album-art"></div>
            <div class="media-info">
                <h3 id="media-title">France Info</h3>
                <p id="media-source">Actualités en direct</p>
            </div>
            <div class="controls">
                <!-- Boutons avec appels directs aux fonctions pour le tactile -->
                <button class="btn-icon" onclick="prevStation()">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="btn-icon btn-play" id="play-btn" onclick="togglePlay()">
                    <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="btn-icon" onclick="nextStation()">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <!-- Lecteur Audio HTML5 caché -->
            <audio id="audio-player" preload="none"></audio>
        </div>

        <!-- Météo (Bouton Paramètres) -->
        <div class="card weather-card" onclick="toggleSettings()">
            <div>
                <div class="w-temp" id="dash-temp">24°</div>
                <div style="color:var(--text-secondary); margin-top:5px;" id="dash-city">Paris (Réglages)</div>
            </div>
            <div class="w-icon">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
            </div>
        </div>

        <!-- Date -->
        <div class="card info-card" style="justify-content:center; align-items:center; text-align:center;">
            <div style="font-size:32px; font-weight:500;" id="dash-date-day">Lundi 20</div>
            <div style="color:var(--text-secondary); font-size: 18px; margin-top:5px;" id="dash-date-month">Juillet 2026</div>
        </div>

        <!-- Liste des Radios -->
        <div class="card info-card" style="grid-column: span 2;">
            <h4>
                <svg viewBox="0 0 24 24"><path d="M12 20c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m0-18C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 5h2v6h-2zm0 8h2v2h-2z"/></svg>
                Radios Locales & Infos
            </h4>
            <div class="radio-list" id="radio-list">
                <!-- Généré par JavaScript -->
            </div>
        </div>
    </div>

    <!-- PANNEAU DES PARAMETRES -->
    <div id="settings-panel">
        <div class="settings-group">
            <label>Interface & Couleurs</label>
            <select onchange="changeTheme(this.value)">
                <option value="dark-glass">Sombre (Dark Glass)</option>
                <option value="light-glass">Clair (Light Glass)</option>
                <option value="blue-glass">Bleu Nuit</option>
            </select>
        </div>

        <div class="settings-group">
            <label>Mode Veille (Fond)</label>
            <select id="idle-bg-select" onchange="changeIdleMode(this.value)">
                <option value="wallpaper">Paysages Automatiques</option>
                <option value="standby">iPhone StandBy (Noir OLED pur)</option>
            </select>
        </div>

        <div class="settings-group">
            <label>Taille Horloge (Veille)</label>
            <select onchange="changeClockSize(this.value)">
                <option value="size-medium">Moyenne</option>
                <option value="size-small">Petite</option>
                <option value="size-large">Grande</option>
            </select>
        </div>

        <button onclick="toggleSettings()" style="margin-top:15px; padding:12px; border-radius:8px; border:none; background:var(--accent); color:#000; font-weight:bold; font-size:16px; cursor:pointer;">Valider & Fermer</button>
    </div>

<script>
    // --- 1. HORLOGE ---
    function updateClock() {
        const d = new Date();
        const time = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('idle-clock').textContent = time;
        document.getElementById('dash-clock').textContent = time;
        
        document.getElementById('dash-date-day').textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric' });
        document.getElementById('dash-date-month').textContent = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    }
    setInterval(updateClock, 1000); updateClock();

    // --- 2. GESTION DU REVEIL ET DU TACTILE ---
    let idleTimeout;
    const idleScreen = document.getElementById('idle-screen');
    const dashboard = document.getElementById('dashboard');

    function wakeUp() {
        idleScreen.classList.add('hidden');
        dashboard.classList.add('active');
        keepAwake(); // Lancer le chrono
    }

    function goToSleep() {
        dashboard.classList.remove('active');
        idleScreen.classList.remove('hidden');
        document.getElementById('settings-panel').classList.remove('show');
    }

    function keepAwake() {
        clearTimeout(idleTimeout);
        idleTimeout = setTimeout(goToSleep, 45000); // Retour en veille après 45s
    }
    window.onload = keepAwake;

    // --- 3. LECTEUR RADIO (Fix pour le tactile) ---
    // Flux HTTPS fiables pour éviter les blocages du navigateur
    const stations = [
        { name: "France Info", source: "Info en continu", url: "https://icecast.radio-france.fr/franceinfo-midfi.mp3", img: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?q=80&w=600" },
        { name: "RFI Monde", source: "Info Internationale", url: "https://rfimondevn.ice.infomaniak.ch/rfimondevn-96k.mp3", img: "https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=600" },
        { name: "FIP", source: "Musique Éclectique", url: "https://icecast.radio-france.fr/fip-midfi.mp3", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=600" },
        { name: "Chérie FM Relax", source: "Musique Douce", url: "https://scdn.nrj.net/audio1/fr/30201/mp3_128.mp3", img: "https://images.unsplash.com/photo-1493225457124-a1a2a53605ec?q=80&w=600" }
    ];
    let currentStation = 0;
    const audio = document.getElementById('audio-player');
    const playIcon = document.getElementById('play-icon');

    function renderRadios() {
        const list = document.getElementById('radio-list');
        list.innerHTML = stations.map((s, i) => `
            <div class="radio-item" onclick="loadStation(${i}); forcePlay(); keepAwake();">
                <div style="width:45px;height:45px;border-radius:10px;background:url('${s.img}') center/cover;"></div>
                <div>
                    <div style="font-weight:bold; font-size:16px;">${s.name}</div>
                    <div style="font-size:13px;color:var(--text-secondary);">${s.source}</div>
                </div>
            </div>
        `).join('');
    }
    renderRadios();

    function loadStation(index) {
        currentStation = index;
        const s = stations[index];
        audio.src = s.url;
        document.getElementById('media-title').textContent = s.name;
        document.getElementById('media-source').textContent = s.source;
        document.getElementById('album-art').style.backgroundImage = `url('${s.img}')`;
    }
    loadStation(0);

    function togglePlay() {
        if (audio.paused) {
            audio.play();
            setPauseIcon();
        } else {
            audio.pause();
            setPlayIcon();
        }
        keepAwake();
    }

    function forcePlay() {
        audio.play().then(() => setPauseIcon()).catch(e => console.log("Cliquer pour jouer"));
    }

    function setPlayIcon() { playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`; }
    function setPauseIcon() { playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`; }

    function nextStation() { loadStation((currentStation + 1) % stations.length); forcePlay(); keepAwake(); }
    function prevStation() { loadStation((currentStation - 1 + stations.length) % stations.length); forcePlay(); keepAwake(); }

    // --- 4. PARAMETRES ET THEMES ---
    function toggleSettings() {
        document.getElementById('settings-panel').classList.toggle('show');
        keepAwake();
    }

    function changeTheme(themeName) {
        document.body.className = themeName;
        // Conserver le mode standby s'il était actif
        if(document.getElementById('idle-bg-select').value === "standby") {
            document.body.classList.add('standby-mode');
        }
    }

    function changeClockSize(sizeClass) {
        const clock = document.getElementById('idle-clock');
        clock.className = `idle-time ${sizeClass}`;
    }

    let wallpaperInterval;
    function changeIdleMode(mode) {
        if (mode === "standby") {
            // Mode iPhone : Fond noir OLED, Texte Rouge
            document.body.classList.add('standby-mode');
            clearInterval(wallpaperInterval);
        } else {
            // Mode Paysage : Image Unsplash qui tourne
            document.body.classList.remove('standby-mode');
            startWallpapers();
        }
    }

    function startWallpapers() {
        clearInterval(wallpaperInterval);
        wallpaperInterval = setInterval(() => {
            // Rajoute un timestamp pour forcer le rechargement d'une nouvelle image aléatoire
            const timestamp = new Date().getTime();
            document.getElementById('bg-img').style.backgroundImage = `url('https://source.unsplash.com/1920x1080/?landscape,nature&sig=${timestamp}')`;
        }, 60000); // Change toutes les minutes
    }
    // Démarrer le carrousel de fonds d'écran au chargement
    startWallpapers();

</script>
</body>
</html>
