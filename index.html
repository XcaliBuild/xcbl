<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Pro App</title>
    <style>
        /* CSS simplifié pour la structure */
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .app { max-width: 420px; margin: auto; height: 100vh; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; padding: 15px; }
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ad-space { width: 100%; height: 90px; background: #222; text-align: center; }
        .btn-nav { cursor: pointer; padding: 10px; background: #333; border: none; color: #fff; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="app">
        <header class="header">
            <button class="btn-nav" onclick="goLive()">°LIVE</button>
            <nav>
                <button onclick="showPodcasts()">PODCAST</button>
                <button onclick="showReplay()">REPLAY</button>
                <button onclick="showAbout()">CONTACT</button>
            </nav>
        </header>

        <main class="main" id="content">
            <h1 id="station-name">Chargement...</h1>
            <div id="player-controls"></div>
        </main>

        <div id="ad-space" class="ad-space" style="display:none;"></div>
    </div>

    <script>
        let DATA = {};

        async function init() {
            // Charge le fichier JSON local
            const response = await fetch('data.json');
            DATA = await response.json();
            
            // Initialisation de la pub
            if(DATA.global.ads_enabled) {
                const ad = document.getElementById('ad-space');
                ad.style.display = "block";
                ad.innerHTML = `<img src="${DATA.global.ads_url}" style="width:100%; height:100%;">`;
            }
            
            goLive();
        }

        function goLive() {
            const liveStation = DATA.playlist.find(s => s.isLive);
            document.getElementById('station-name').textContent = liveStation.emission;
        }

        function showReplay() {
            document.getElementById('content').innerHTML = `<h2>Replay</h2><input type="text" placeholder="Rechercher une émission...">`;
        }

        function showAbout() {
            document.getElementById('content').innerHTML = `
                <h2>Contact</h2>
                <p>${DATA.global.entreprise}</p>
                <p>Email: ${DATA.global.email}</p>
                ${DATA.global.send_message ? '<textarea placeholder="Votre message"></textarea><button>Envoyer</button>' : ''}
            `;
        }

        window.onload = init;
    </script>
</body>
</html>
